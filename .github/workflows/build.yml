name: Build Mi Remote APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project and Build APK
        run: |
          cat << 'EOF' > generate.py
          import os, subprocess
          from pathlib import Path

          P = Path("XiaomiRemoteProject")
          PKG = "com/xiaomi/stickremote"

          FILES = {
              "settings.gradle.kts": 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "XiaomiStickRemote"\ninclude(":app")',
              "build.gradle.kts": 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }',
              "gradle.properties": "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true",
              "app/build.gradle.kts": 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }\nandroid {\n namespace = "com.xiaomi.stickremote"\n compileSdk = 34\n defaultConfig { applicationId = "com.xiaomi.stickremote"; minSdk = 28; targetSdk = 34; versionCode = 1; versionName = "1.0" }\n compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }\n kotlinOptions { jvmTarget = "17" }\n}\ndependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0") }'
          }
          for k, v in FILES.items():
              p = P / k
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(v, encoding="utf-8")
          EOF
          python3 generate.py
